<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Universo Romántico</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Google (Caveat & Poppins) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      background-color: #05020a;
    }
    .font-romantic {
      font-family: 'Caveat', cursive;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      pointer-events: none;
    }

    /* Transition & Animation Custom */
    .photo-card {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .photo-card:hover {
      transform: scale(1.08) rotate(0deg) !important;
      box-shadow: 0 0 25px rgba(244, 114, 182, 0.6);
      z-index: 40;
    }

    .pulse-text {
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      0% {
        text-shadow: 0 0 10px rgba(244, 114, 182, 0.6);
      }
      100% {
        text-shadow: 0 0 25px rgba(244, 114, 182, 1), 0 0 35px rgba(192, 132, 252, 0.8);
      }
    }
  </style>

  <!-- Import Map untuk Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="bg-[#05020a] text-white h-screen w-screen relative overflow-hidden select-none">

  <!-- Canvas Three.js -->
  <div id="canvas-container" class="absolute inset-0 z-0"></div>

  <!-- Header Judul Utama -->
  <div class="absolute top-6 left-0 right-0 z-20 text-center pointer-events-none transition-all duration-700 ease-in-out">
    <h1 class="font-romantic text-5xl md:text-7xl text-pink-300 pulse-text">
      Dunia Yang Nanti,
    </h1>
    <p class="text-sm md:text-base text-purple-200 tracking-wider mt-1 opacity-90 transition-opacity duration-500 hover:opacity-100">
      Kisah kita bersatu di sana ♡
    </p>
  </div>

  <!-- Bingkai Foto Kiri & Kanan (Dengan Transisi Hover Smooth) -->
  <div class="absolute inset-0 z-20 pointer-events-none p-4 md:p-8 flex justify-between items-center">
    
    <!-- Kolom Kiri -->
    <div class="flex flex-col gap-6 md:gap-12 max-w-[150px] md:max-w-[200px] pointer-events-auto">
      <div class="photo-card relative p-1.5 bg-white/10 backdrop-blur-md rounded-2xl border border-pink-500/30 -rotate-6 shadow-lg shadow-pink-500/10 cursor-pointer">
        <img src="./653afb76-c1d1-4e46-b67e-8f330500ca33.jfif" alt="Foto 1" class="rounded-xl w-full aspect-square object-cover">
        <p class="font-romantic text-xs md:text-sm text-pink-200 text-center mt-2">Jatuh cinta dikatakan jatuh. ♡</p>
      </div>
      <div class="photo-card relative p-1.5 bg-white/10 backdrop-blur-md rounded-2xl border border-purple-500/30 rotate-3 shadow-lg shadow-purple-500/10 cursor-pointer">
        <img src="./d32a9e22-bbbe-4a42-817a-bc5a96e4bbdb.jfif" alt="Foto 2" class="rounded-xl w-full aspect-square object-cover">
      </div>
    </div>

    <!-- Kolom Kanan -->
    <div class="flex flex-col gap-6 md:gap-12 max-w-[150px] md:max-w-[200px] pointer-events-auto">
      <div class="photo-card relative p-1.5 bg-white/10 backdrop-blur-md rounded-2xl border border-purple-500/30 rotate-6 shadow-lg shadow-purple-500/10 cursor-pointer">
        <img src="./72a108ed-6106-49a3-beb1-140fc605717e.jfif" alt="Foto 3" class="rounded-xl w-full aspect-square object-cover">
      </div>
      <div class="photo-card relative p-1.5 bg-white/10 backdrop-blur-md rounded-2xl border border-pink-500/30 -rotate-3 shadow-lg shadow-pink-500/10 cursor-pointer">
        <img src="./e3e2967b-8099-4870-85d9-5ebd8872fac4.jfif" alt="Foto 4" class="rounded-xl w-full aspect-square object-cover">
        <p class="font-romantic text-xs md:text-sm text-pink-200 text-center mt-2">Kudoakan kisah kita satu. ♡</p>
      </div>
    </div>

  </div>

  <!-- Music Player Minimalis -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 -translate-y-1/2  z-30 w-[90%] max-w-md bg-white/10 backdrop-blur-lg border border-white/20 p-4 rounded-2xl text-center shadow-2xl transition-all duration-300 hover:bg-white/15 hover:border-pink-500/40">
    <p class="text-xs text-pink-300 font-semibold uppercase tracking-widest">Syakira & Ihsan</p>
    <p class="text-xs text-gray-300 mt-0.5 mb-2">Ihsan alfarizi ♡</p>
    
    <div class="flex items-center justify-center gap-4 text-white">
      <button class="hover:text-pink-400 transition-colors duration-200 transform hover:scale-110">⏮</button>
      <button id="playBtn" class="w-10 h-10 rounded-full bg-pink-500 hover:bg-pink-600 flex items-center justify-center text-white shadow-lg shadow-pink-500/50 transition-all duration-300 transform hover:scale-110">
        ▶
      </button>
      <button class="hover:text-pink-400 transition-colors duration-200 transform hover:scale-110">⏭</button>
    </div>
  </div>

  <!-- Simpan file lagu bernama 'dunia-yang-nanti.mp3' di folder yang sama -->
  <audio id="bgAudio" loop>
    <source src="./Dunia Yang Nanti - Raim Laode  Lirik Lagu.mp3" type="audio/mpeg">
  </audio>

  <!-- Script Three.js -->
  <script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, galaxyGroup, heartMesh;
    let clock = new THREE.Clock();

    // Lirik lagu Dunia Yang Nanti - Raim Laode
    const textContents = [
      "JATUH CINITA ♡", 
      "DIKATAKAN JATUH ♡", 
      "KARENA TAK BISA ♡", 
      "KUPUNYAI ♡", 
      "KUDOAKAN KISAH KITA ♡", 
      "SATU DI DUNIA YANG NANTI ♡"
    ];

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 12, 18);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      galaxyGroup = new THREE.Group();
      scene.add(galaxyGroup);

      createGalaxyParticles();
      createTextOrbit();
      createCenterHeart();

      window.addEventListener('resize', onWindowResize);

      const playBtn = document.getElementById('playBtn');
      const bgAudio = document.getElementById('bgAudio');
      playBtn.addEventListener('click', () => {
        if (bgAudio.paused) {
          bgAudio.play();
          playBtn.innerText = '⏸';
        } else {
          bgAudio.pause();
          playBtn.innerText = '▶';
        }
      });

      animate();
    }

    function createGalaxyParticles() {
      const particleCount = 14000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const colorInside = new THREE.Color('#ff00aa');
      const colorOutside = new THREE.Color('#00d4ff');

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const radius = Math.random() * 13 + 0.5;
        const spinAngle = radius * 1.5;
        const branchAngle = ((i % 3) * 2 * Math.PI) / 3;

        const randomX = (Math.random() - 0.5) * 0.8 * radius;
        const randomY = (Math.random() - 0.5) * 0.5;
        const randomZ = (Math.random() - 0.5) * 0.8 * radius;

        positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
        positions[i3 + 1] = randomY;
        positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

        const mixedColor = colorInside.clone().lerp(colorOutside, radius / 13);
        colors[i3] = mixedColor.r;
        colors[i3 + 1] = mixedColor.g;
        colors[i3 + 2] = mixedColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.08,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });

      const points = new THREE.Points(geometry, material);
      galaxyGroup.add(points);
    }

    function createTextOrbit() {
      textContents.forEach((text, index) => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 512;
        canvas.height = 128;

        ctx.font = 'Bold 36px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#f472b6';
        ctx.shadowBlur = 15;
        ctx.textAlign = 'center';
        ctx.fillText(text, 256, 70);

        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(spriteMaterial);

        const angle = (index / textContents.length) * Math.PI * 2;
        const radius = 7.5;
        
        sprite.position.x = Math.cos(angle) * radius;
        sprite.position.z = Math.sin(angle) * radius;
        sprite.position.y = (Math.random() - 0.5) * 0.5;
        sprite.scale.set(4, 1, 1);

        galaxyGroup.add(sprite);
      });
    }

    function createCenterHeart() {
      const heartShape = new THREE.Shape();
      const x = 0, y = 0;
      heartShape.moveTo(x + 0.25, y + 0.25);
      heartShape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
      heartShape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
      heartShape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 0.95);
      heartShape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
      heartShape.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
      heartShape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

      const extrudeSettings = { depth: 0.2, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.1, bevelThickness: 0.1 };
      const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
      geometry.center();

      const material = new THREE.MeshBasicMaterial({ color: 0xff3399, wireframe: true });
      heartMesh = new THREE.Mesh(geometry, material);
      heartMesh.rotation.x = Math.PI;
      
      galaxyGroup.add(heartMesh);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      
      const elapsedTime = clock.getElapsedTime();

      // Rotasi halus pada seluruh galaksi
      galaxyGroup.rotation.y = elapsedTime * 0.12;

      // Animasi Denyut Jantung (Heartbeat Pulse Effect)
      if (heartMesh) {
        const scale = 2 + Math.sin(elapsedTime * 3) * 0.15;
        heartMesh.scale.set(scale, scale, scale);
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
